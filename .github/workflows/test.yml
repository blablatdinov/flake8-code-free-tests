---
name: test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install poetry
      run: |
        curl -sSL "https://install.python-poetry.org" | python

        # Adding `poetry` to `$PATH`:
        echo "$HOME/.poetry/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        poetry config virtualenvs.in-project true
        poetry run pip install -U pip
        poetry install

        sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b $HOME/.local/bin

        curl -O -L -C - https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v3.6.0/ec-linux-amd64.tar.gz
        tar xzf ec-linux-amd64.tar.gz -C $HOME/.local/bin
        mv $HOME/.local/bin/bin/ec-linux-amd64 $HOME/.local/bin/ec

    - name: Run checks
      run: task

    # Upload coverage to codecov: https://codecov.io/
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
